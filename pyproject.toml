[project]
name = "alphago-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["polars", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alphago_data"]
